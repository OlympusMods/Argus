plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	mods {
		"argus" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	implementation "maven.modrinth:S9H9TVdr:${project.proteus_version}"
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter-api:5.9.2"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.9.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.9.2"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = mod_java.toInteger()
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(mod_java)
	targetCompatibility = JavaVersion.toVersion(mod_java)
}

ext.modPublish = [
	loader: 'fabric',
	label: mod_label,
	java: mod_java.toInteger(),
	requires: ['fabric-api', 'proteus'],
	jar: { tasks.jar.archiveFile }
]
apply from: 'publish.gradle'
