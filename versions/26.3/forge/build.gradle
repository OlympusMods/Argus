plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = findProperty('mod_version') ?: '1.1.0'
group = 'com.github.olympus.argus'

java.toolchain.languageVersion = JavaLanguageVersion.of(mod_java.toInteger())

sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'argus'

            args '--mixin.config', 'argus.mixins.json'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'argus', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation "maven.modrinth:S9H9TVdr:${project.proteus_version}"
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes 'MixinConfigs': 'argus.mixins.json'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def forgeModVersion = project.version.toString()

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_version', forgeModVersion
    filesMatching('META-INF/mods.toml') {
        expand(mod_version: forgeModVersion)
    }
}

ext.modPublish = [
    loader: 'forge',
    label: mod_label,
    java: mod_java.toInteger(),
    requires: ['proteus'],
    jar: { tasks.jar.archiveFile }
]
apply from: 'publish.gradle'
